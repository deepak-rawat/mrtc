name: build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        configuration: [Debug, Release]
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: msys2 {0}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev libvpx-dev libopus-dev libusrsctp-dev coturn
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf openssl@4 libwebsockets cjson \
            libvpx opus sdl3 libusrsctp
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libwebsockets
            mingw-w64-ucrt-x86_64-cjson
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-usrsctp
      - name: Configure
        run: |
          args=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            args+=("-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@4)")
            args+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)")
          fi
          cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} "${args[@]}"
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure --timeout 120
      - name: Verify server without the native client facade
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/server-only -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DMRTC_ENABLE_CLIENT_API=OFF -DMRTC_BUILD_TESTS=OFF
          cmake --build build/server-only --parallel 2 --target mrtc_server

  address-sanitizer:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev libvpx-dev libopus-dev libusrsctp-dev coturn
      - name: Configure
        run: >-
          cmake -S . -B build/asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DMRTC_ENABLE_ASAN=ON -DMRTC_ENABLE_UBSAN=ON
      - name: Build
        run: cmake --build build/asan --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build/asan --output-on-failure --timeout 120

  browser-interop:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/mrtc-playwright
      MRTC_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            app/web/package-lock.json
            tests/interop/package-lock.json
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev libvpx-dev libopus-dev libusrsctp-dev
      - name: Build the browser application
        run: |
          npm --prefix app/web ci
          npm --prefix app/web test
          npm --prefix app/web run build
      - name: Build local server and native fixtures
        run: |
          cmake -S . -B build/browser -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/browser --parallel 4 --target mrtc_server mrtc_cli
      - name: Install browser dependencies
        working-directory: tests/interop
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify real UI, native interoperability, migration and churn
        working-directory: tests/interop
        env:
          MRTC_BUILD_DIR: ${{ github.workspace }}/build/browser
          MRTC_WEB_ROOT: ${{ github.workspace }}/app/web/dist
          MRTC_TEST_ARTIFACTS: ${{ github.workspace }}/build/interop-failures
        run: npm run test:all
      - name: Save interoperability failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-interop-failures-${{ matrix.browser }}
          path: build/interop-failures
          if-no-files-found: ignore

  thread-sanitizer:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev libvpx-dev libopus-dev libusrsctp-dev coturn openssl
      - name: Build concurrency fixtures
        run: |
          cmake -S . -B build/tsan -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug -DMRTC_ENABLE_TSAN=ON \
            -DMRTC_BUILD_DESKTOP=OFF
          cmake --build build/tsan --parallel 4 --target test_worker test_network_runtime \
            test_peer test_peer_integration test_routing_media test_sfu_session
      - name: Test worker, relay, peer and routing concurrency
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/tsan --output-on-failure --timeout 120 -R '^test_(worker|network_runtime|routing_media|sfu_session|peer|network_turn_(tcp|tls)|peer_turn_(tcp|tls))$'

  parser-fuzz:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev
      - name: Build instrumented parsers
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_C_COMPILER=clang \
            -DCMAKE_BUILD_TYPE=Debug -DMRTC_BUILD_FUZZERS=ON \
            -DMRTC_ENABLE_ASAN=ON -DMRTC_ENABLE_UBSAN=ON \
            -DMRTC_BUILD_TESTS=OFF -DMRTC_ENABLE_CLIENT_API=OFF \
            -DMRTC_ENABLE_ROUTING_API=OFF
          cmake --build build/fuzz --parallel 4 --target fuzz_packet_parsers
      - name: Exercise parsers
        run: |
          mkdir -p build/fuzz/corpus build/fuzz/findings
          build/fuzz/rtc/fuzz_packet_parsers build/fuzz/corpus \
            -max_total_time=60 -max_len=8192 -print_final_stats=1 \
            -artifact_prefix=build/fuzz/findings/
      - name: Save reproducing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-fuzz-findings
          path: build/fuzz/findings
          if-no-files-found: ignore

  headless-native:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install native dependencies without SDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libssl-dev \
            libwebsockets-dev libcjson-dev libvpx-dev libopus-dev libusrsctp-dev
      - name: Build headless applications
        run: |
          cmake -S . -B build/headless -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DMRTC_BUILD_DESKTOP=OFF
          cmake --build build/headless --parallel 4 --target mrtc_server mrtc_cli
      - name: Verify controller and real native media
        env:
          MRTC_BUILD_DIR: ${{ github.workspace }}/build/headless
          MRTC_TEST_ARTIFACTS: ${{ github.workspace }}/build/interop-failures
        run: |
          npm --prefix tests/interop run test:controller
          npm --prefix tests/interop run test:native
      - name: Save headless failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-headless-failures
          path: build/interop-failures
          if-no-files-found: ignore
      - name: Short native media and RSS soak
        env:
          MRTC_BUILD_DIR: ${{ github.workspace }}/build/headless
          MRTC_SOAK_SECONDS: '30'
          MRTC_SOAK_PEERS: '3'
          MRTC_SOAK_REPORT: build/soak-native.jsonl
        run: npm --prefix tests/interop run test:soak
      - name: Save sampled soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-soak-evidence
          path: build/soak-native.jsonl
          if-no-files-found: ignore

<!doctype html>
<meta charset="utf-8">
<title>mrtc local interoperability fixture</title>
<div id="tiles"></div>
<script>
window.startConference = async function (url, meeting) {
    const state = window.conference = {
        pcs: new Map(), audioContexts: new Map(), errors: [], messages: [], events: [], id: null
    };
    const ws = new WebSocket(url, 'signaling');
    state.ws = ws;
    const send = (type, to, fields) => ws.send(JSON.stringify({ type, to, ...fields }));
    const make = id => {
        const pc = new RTCPeerConnection({ iceServers: [] });
        state.pcs.set(id, pc);
        pc.onicecandidate = event => send('candidate', id, {
            candidate: event.candidate ? event.candidate.candidate : ''
        });
        pc.ontrack = event => {
            let tile = document.getElementById(`peer-${id}`);
            if (!tile) {
                tile = document.createElement('video');
                tile.id = `peer-${id}`;
                tile.autoplay = true;
                tile.muted = true;
                tile.srcObject = new MediaStream();
                document.getElementById('tiles').append(tile);
            }
            tile.srcObject.addTrack(event.track);
            tile.play().catch(error => state.errors.push(String(error)));
            if (event.track.kind === 'audio') {
                const context = new AudioContext({sampleRate: 48000});
                const source = context.createMediaStreamSource(new MediaStream([event.track]));
                const gain = context.createGain();
                gain.gain.value = 0;
                source.connect(gain).connect(context.destination);
                state.audioContexts.set(id, context);
                context.resume().catch(error => state.errors.push(String(error)));
            }
        };
        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed') state.errors.push(`connection failed: ${id}`);
        };
        return pc;
    };
    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', meeting }));
    ws.onmessage = event => {
        state.chain = (state.chain || Promise.resolve()).then(async () => {
            const message = JSON.parse(event.data);
            state.events.push(`${message.type}:${message.from || message.peer_id || ''}`);
            if (message.type === 'error') throw Error(message.message);
            if (message.type === 'joined') {
                if (message.mode !== 'sfu') throw Error('server did not select SFU');
                state.id = message.peer_id;
                const pc = make('sfu');
                const canvas = document.createElement('canvas');
                canvas.width = 160; canvas.height = 120;
                const context = canvas.getContext('2d');
                let frame = 0;
                state.paint = setInterval(() => {
                    context.fillStyle = `rgb(${frame++ % 255},80,120)`;
                    context.fillRect(0, 0, canvas.width, canvas.height);
                }, 50);
                const video = canvas.captureStream(10).getVideoTracks()[0];
                if (typeof MediaStreamTrackGenerator !== 'function')
                    throw Error('Chromium audio track generator unavailable');
                state.audioTrack = new MediaStreamTrackGenerator({kind: 'audio'});
                state.audioWriter = state.audioTrack.writable.getWriter();
                let samples = 0;
                state.tone = setInterval(async () => {
                    const pcm = new Float32Array(960);
                    for (let i = 0; i < pcm.length; i++)
                        pcm[i] = 0.1 * Math.sin(2 * Math.PI * 440 * (samples + i) / 48000);
                    const audio = new AudioData({format: 'f32', sampleRate: 48000,
                        numberOfFrames: 960, numberOfChannels: 1,
                        timestamp: samples * 1000000 / 48000, data: pcm});
                    samples += 960;
                    try { await state.audioWriter.write(audio); }
                    catch (error) { if (!state.closed) state.errors.push(String(error)); }
                    finally { audio.close(); }
                }, 20);
                pc.addTrack(video);
                pc.addTrack(state.audioTrack);
                for (const transceiver of pc.getTransceivers()) {
                    const kind = transceiver.sender.track.kind;
                    const codecs = RTCRtpSender.getCapabilities(kind).codecs.filter(codec =>
                        codec.mimeType.toLowerCase() === (kind === 'video' ? 'video/vp8' : 'audio/opus'));
                    transceiver.setCodecPreferences(codecs);
                }
                const dc = state.dc = pc.createDataChannel('chat');
                dc.binaryType = 'arraybuffer';
                dc.onmessage = event => {
                    const bytes = typeof event.data === 'string' ? null : new Uint8Array(event.data);
                    const text = bytes ? new TextDecoder().decode(bytes) : event.data;
                    state.messages.push(text.startsWith('MRTC') ? text.slice(20) : text);
                };
                dc.onopen = () => dc.send('browser-datachannel');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                send('offer', 'sfu', { sdp: offer.sdp });
            } else if (message.type === 'offer') {
                const pc = state.pcs.get(message.from) || make(message.from);
                await pc.setRemoteDescription({ type: 'offer', sdp: message.sdp });
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                send('answer', message.from, { sdp: answer.sdp });
            } else if (message.type === 'answer') {
                await state.pcs.get(message.from).setRemoteDescription({
                    type: 'answer', sdp: message.sdp
                });
                if (message.from === 'sfu')
                    state.publisherAnswers = (state.publisherAnswers || 0) + 1;
            } else if (message.type === 'candidate') {
                await state.pcs.get(message.from).addIceCandidate(message.candidate ?
                    { candidate: message.candidate, sdpMLineIndex: 0 } : null);
            } else if (message.type === 'peer_left') {
                state.pcs.get(message.peer_id)?.close();
                state.pcs.delete(message.peer_id);
                await state.audioContexts.get(message.peer_id)?.close();
                state.audioContexts.delete(message.peer_id);
                document.getElementById(`peer-${message.peer_id}`)?.remove();
            }
        }).catch(error => state.errors.push(String(error)));
    };
    state.renegotiate = async (direction, restart = false) => {
        const pc = state.pcs.get('sfu');
        pc.getTransceivers().find(t => t.sender.track?.kind === 'video').direction = direction;
        const offer = await pc.createOffer({iceRestart: restart});
        await pc.setLocalDescription(offer);
        send('offer', 'sfu', {sdp: offer.sdp});
    };
    state.stats = async () => {
        let video = 0, audio = 0;
        for (const [id, pc] of state.pcs) {
            if (id === 'sfu') continue;
            for (const report of (await pc.getStats()).values()) {
                if (report.type !== 'inbound-rtp') continue;
                if (report.kind === 'video') video += report.framesDecoded || 0;
                if (report.kind === 'audio') audio += report.totalSamplesReceived || 0;
            }
        }
        const connections = [];
        for (const [id, pc] of state.pcs)
            connections.push({id, ice: pc.iceConnectionState, connection: pc.connectionState,
                transports: [...(await pc.getStats()).values()].filter(report =>
                    ['transport', 'candidate-pair', 'local-candidate', 'remote-candidate',
                        'inbound-rtp', 'outbound-rtp', 'codec'].includes(report.type))});
        return { video, audio, messages: state.messages, errors: state.errors, connections,
            events: state.events, websocket: ws.readyState,
            tiles: document.getElementById('tiles').children.length, id: state.id };
    };
    state.close = async () => {
        state.closed = true;
        clearInterval(state.paint);
        clearInterval(state.tone);
        for (const pc of state.pcs.values()) {
            for (const sender of pc.getSenders()) sender.track?.stop();
            pc.close();
        }
        await Promise.all([...state.audioContexts.values()].map(context => context.close()));
        state.audioContexts.clear();
        ws.close();
        await state.audioWriter?.close().catch(() => {});
    };
};
</script>
